---
apiVersion: v2
description: >-
  OpenShift Vault Secrets Store CSI: optional synced TLS trust ConfigMap for the provider,
  HashiCorp Vault CSI provider DaemonSet (hub or spoke), projected trust mount, and OpenShift SCC
  wiring. Per-application SecretProviderClass manifests use the vp-sscsi-spc library chart.
keywords:
  - openshift
  - secrets-store-csi-driver
  - vault
name: openshift-sscsi-vault
version: 0.1.1
dependencies:
  - name: vault
    version: 0.32.0
    repository: https://helm.releases.hashicorp.com
    condition: ocpSecretsStoreCsiVault.vaultCsiProvider.enabled
